<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="10" stroke-dasharray="20 16"/>

  <!-- Speedometer Arc -->
  <path d="M 120 310 A 150 150 0 1 1 392 310" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="22" stroke-linecap="round"/>
  <path d="M 120 310 A 150 150 0 0 1 310 120" fill="none" stroke="url(#accentGrad512)" stroke-width="22" stroke-linecap="round"/>

  <!-- Car Silhouette Icon -->
  <g filter="url(#shadow512)" transform="translate(110, 200)">
    <!-- Car Body -->
    <path d="M 40 70 L 68 28 C 74 20 86 14 102 14 L 194 14 C 210 14 222 20 228 28 L 256 70 C 274 74 286 84 286 100 L 286 136 C 286 144 278 150 270 150 L 264 150 C 264 164 252 174 238 174 C 224 174 212 164 212 150 L 80 150 C 80 164 68 174 54 174 C 40 174 28 164 28 150 L 22 150 C 14 150 6 144 6 136 L 6 100 C 6 84 18 74 40 70 Z" fill="#ffffff"/>
    
    <!-- Windshield & Windows -->
    <path d="M 76 65 L 94 33 C 98 27 106 24 114 24 L 142 24 L 142 65 Z" fill="#1e3a8a" opacity="0.88"/>
    <path d="M 158 24 L 182 24 C 190 24 198 27 202 33 L 220 65 L 158 65 Z" fill="#1e3a8a" opacity="0.88"/>
    
    <!-- Headlights -->
    <circle cx="38" cy="102" r="10" fill="url(#accentGrad512)"/>
    <circle cx="254" cy="102" r="10" fill="url(#accentGrad512)"/>
    
    <!-- Wheels -->
    <circle cx="54" cy="150" r="18" fill="#0f172a"/>
    <circle cx="54" cy="150" r="8" fill="#94a3b8"/>
    <circle cx="238" cy="150" r="18" fill="#0f172a"/>
    <circle cx="238" cy="150" r="8" fill="#94a3b8"/>
  </g>
</svg>
